<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Occult Digits</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    
    <style>
        .error-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fffcf2;
            text-align: center;
        }
        .error-code {
            font-size: 8rem;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: #d4af37;
            text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.3);
            margin-bottom: 0;
        }
        .error-message {
            color: #8B5A2B;
            font-size: 1.5rem;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="error-section">
        <div class="container">
            <i class="fas fa-dharmachakra fa-4x mb-3" style="color: #8B5A2B; animation: spin 4s linear infinite;"></i>
            <h1 class="error-code">404</h1>
            <h3 class="error-message">Oops! The universe couldn't align this page.</h3>
            <p class="text-muted mb-4">It seems you have wandered off your numeric path. The page you are looking for does not exist.</p>
            <a href="index.html" class="btn btn-primary px-5 py-3 rounded-pill fw-bold shadow-lg">
                <i class="fas fa-home me-2"></i>Return to Home
            </a>
        </div>
    </div>

</body>
</html>
